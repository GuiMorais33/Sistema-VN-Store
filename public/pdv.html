<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070907">
<title>VN Store — PDV</title>
<link rel="icon" href="/logo.webp">
<link rel="stylesheet" href="/theme.css">
<style>
  .layout{display:grid;grid-template-columns:1fr 372px;gap:var(--s4);align-items:start}
  @media (max-width:960px){.layout{grid-template-columns:1fr}}

  /* Catálogo */
  .grid-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--s3);margin-top:var(--s3)}
  .prod{
    display:flex;flex-direction:column;gap:5px;padding:9px;text-align:left;cursor:pointer;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:var(--r-lg);
    transition:transform var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast);
  }
  .prod:hover{transform:translateY(-2px);border-color:rgba(47,210,79,.42);box-shadow:var(--sh-2)}
  .prod:active{transform:translateY(0)}
  .prod:disabled{opacity:.38;cursor:not-allowed;transform:none}
  .prod .thumb{width:100%;aspect-ratio:1;max-height:118px}
  .prod .nm{font-weight:600;font-size:13px;line-height:1.3;color:var(--ink)}
  .prod .vr{font-size:11px;color:var(--ink-3)}
  .prod .bot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:3px}
  /* cor explícita: o cartão é um <button>, e sem ela o preço herdava o preto do navegador */
  .prod .pr{font-family:var(--font-mono);font-weight:700;font-size:13.5px;color:var(--ink)}
  .prod .st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .st.ok{color:var(--ok)} .st.low{color:var(--warn)} .st.out{color:var(--crit)}
  /* Sob encomenda: vende normal, mas o par é buscado no fornecedor. */
  .st.enc{color:var(--info,#6aa9ff)}
  .line .meta .enc{color:var(--warn);font-weight:700}

  /* Carrinho */
  .cart{position:sticky;top:var(--s4);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  .cart-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
  .cart-head h2{margin:0;font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.5px;font-size:17px;transform:skewX(-5deg)}
  .cart-count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
  .lines{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;
    background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:var(--r)}
  .line .nm{font-size:12.5px;font-weight:600;line-height:1.3}
  .line .meta{font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono);margin-top:2px}
  .line .rm{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:11px;padding:2px 0;text-align:left}
  .line .rm:hover{color:var(--crit)}
  .qty{display:flex;align-items:center;gap:5px;justify-content:flex-end}
  .qty button{width:25px;height:25px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-size:15px;cursor:pointer;line-height:1;display:grid;place-items:center;transition:var(--t-fast)}
  .qty button:hover{border-color:var(--brand);color:var(--brand-hi)}
  .qty span{min-width:20px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:13px}
  .line .lt{font-family:var(--font-mono);font-weight:700;font-size:13px;text-align:right;margin-top:3px}

  .cust-wrap{position:relative}
  .cust-list{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:5px;overflow:hidden;display:none;
    background:var(--surface-3);border:1px solid var(--line-str);border-radius:var(--r);box-shadow:var(--sh-2)}
  .cust-list.show{display:block}
  .cust-list button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    padding:9px 12px;background:none;border:none;color:var(--ink);font-size:13px;cursor:pointer}
  .cust-list button:hover{background:var(--surface-2)}
  .cust-list .new{color:var(--brand-hi);font-weight:700;border-top:1px solid var(--line)}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;width:fit-content;
    background:rgba(47,210,79,.09);border:1px solid rgba(47,210,79,.3);color:var(--brand-hi);font-size:12.5px;font-weight:700}
  .chip[hidden]{display:none}
  .chip .ig{font-family:var(--font-mono);font-weight:500;opacity:.75;font-size:11.5px}
  .chip button{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:13px;line-height:1}
  .chip button:hover{color:var(--crit)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .seg-b{padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);
    color:var(--ink-3);font-size:12px;font-weight:700;cursor:pointer;transition:var(--t-fast)}
  .seg-b:hover{color:var(--ink)}
  .seg-b.sel{border-color:var(--brand);color:var(--brand-hi);background:rgba(47,210,79,.1)}
  .seg-b.warn.sel{border-color:var(--warn);color:var(--warn);background:rgba(232,163,23,.1)}
  .pays{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .pay{padding:8px 3px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);
    color:var(--ink-3);font-size:10.5px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:var(--t-fast)}
  .pay:hover{color:var(--ink)}
  .pay.sel{border-color:var(--brand);color:var(--brand-hi);background:rgba(47,210,79,.1)}
  .canais{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  /* Quem vendeu: um botão por vendedor. Sem escolha não fecha a venda —
     é daqui que sai a comissão. */
  .vends{display:flex;flex-wrap:wrap;gap:5px}
  .vends .pay{flex:1 1 28%;min-width:84px;text-transform:none;font-size:12.5px}
  .vends .pay.loja{color:var(--ink-3)}
  #wrapVend.falta label{color:var(--warn)}
  #wrapVend.falta .vends{outline:1px dashed rgba(232,163,23,.6);outline-offset:3px;border-radius:9px}
  .vvend{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .vvend select{width:auto;padding:5px 8px;font-size:12.5px}
  .eu{font-size:12px;color:var(--ink-3);margin-top:-4px}
  .eu b{color:var(--brand-hi)}

  .totals{border-top:1px dashed var(--line);padding-top:var(--s3);display:flex;flex-direction:column;gap:5px;font-size:13px}
  .totals .r{display:flex;justify-content:space-between;color:var(--ink-3)}
  .totals .r.big{color:var(--ink);font-size:21px;font-weight:800;align-items:baseline;margin-top:3px}
  .totals .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .totals .big .v{color:var(--brand-hi);text-shadow:0 0 16px var(--glow)}

  /* Toque no produto: o cartão acende rapidinho, confirmando que entrou. */
  .prod.foi{animation:foi .45s ease}
  @keyframes foi{0%{border-color:var(--brand);box-shadow:0 0 0 0 rgba(47,210,79,.55)}100%{box-shadow:0 0 0 10px rgba(47,210,79,0)}}

  /* Celular: a venda fica lá embaixo, depois do catálogo. Esta barra mostra
     o total o tempo todo e leva até ela com um toque. */
  .cart-bar{display:none}
  @media (max-width:960px){
    .cart-bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:60;
      display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;cursor:pointer;
      font-family:var(--font-body);color:#04170A;border:none;text-align:left;
      background:linear-gradient(180deg,var(--brand-hi),var(--brand));
      box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px var(--glow);
      transition:transform var(--t-med),opacity var(--t-med)}
    .cart-bar[hidden]{display:flex!important;transform:translateY(140%);opacity:0;pointer-events:none}
    .cart-bar .cb-n{font-weight:800;font-size:12px;background:rgba(4,23,10,.14);padding:4px 9px;border-radius:999px;white-space:nowrap}
    .cart-bar .cb-t{font-family:var(--font-mono);font-weight:700;font-size:17px;flex:1}
    .cart-bar .cb-go{font-weight:800;font-size:13px;white-space:nowrap}
    .cart-bar.bump{animation:bump .35s ease}
    body.tem-barra .app{padding-bottom:96px}
    body.tem-barra .toast{bottom:92px}
  }
  @keyframes bump{40%{transform:scale(1.04)}}

  /* Vendas: achar, trocar, cancelar */
  .vtop{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
  .vtop h3{margin:0;font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.5px;font-size:19px;transform:skewX(-5deg)}
  .xbtn{background:none;border:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px}
  .xbtn:hover{color:var(--ink)}
  .vfiltros{display:flex;gap:5px;flex-wrap:wrap}
  .vfiltros .seg-b{padding:7px 12px}
  .vlist{display:flex;flex-direction:column;gap:5px;max-height:58vh;overflow-y:auto}
  .vrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;text-align:left;width:100%;
    background:var(--bg-elev);border:1px solid var(--line-soft);border-radius:var(--r);color:var(--ink);cursor:pointer;font-family:var(--font-body)}
  .vrow:hover{border-color:var(--line-str)}
  .vrow .c{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
  .vrow .n{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vrow small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
  .vrow .t{font-family:var(--font-mono);font-weight:700;font-size:13px;text-align:right}
  .vrow.canc .t{text-decoration:line-through;color:var(--ink-3)}
  .vdet{display:flex;flex-direction:column;gap:var(--s3)}
  .vdet .meta{font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .vdet .meta b{color:var(--ink)}
  .vitem{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:var(--r);background:var(--bg-elev);font-size:13px}
  .vitem .q{font-family:var(--font-mono);color:var(--ink-3)}
  .vitem.volta{color:var(--warn)} .vitem.nova{color:var(--brand-hi)}
  .vitem .v{font-family:var(--font-mono);font-weight:700;white-space:nowrap}
  .vacoes{display:flex;gap:var(--s2);flex-wrap:wrap}
  .vcanc{display:flex;flex-direction:column;gap:var(--s2);padding:12px;border:1px solid rgba(242,86,74,.35);border-radius:var(--r);background:rgba(242,86,74,.05)}
  .vcanc input,.vcanc select{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink)}
  .aviso-site{font-size:12.5px;color:var(--ink-3);padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r)}

  /* Modo troca: o carrinho vira "o que voltou" + "o que leva" */
  .troca-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r);
    background:rgba(232,163,23,.1);border:1px solid rgba(232,163,23,.4);color:var(--warn);font-size:12.5px}
  .troca-banner[hidden],#voltouWrap[hidden]{display:none}
  .troca-banner b{display:block;font-size:13px}
  .sub-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);margin:2px 0 4px}
  body.modo-troca #wrapVend,body.modo-troca #wrapAtend,body.modo-troca .cust-wrap,body.modo-troca #canalWrap,
  body.modo-troca #segWrap,body.modo-troca #discWrap{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="pagehead">
    <div><h1>PDV</h1><div class="ph-sub">Lançamento de vendas · sem taxa</div></div>
    <div class="ph-actions"><button class="btn ghost" id="abrirVendas" type="button">Vendas · trocar ou cancelar</button></div>
  </div>

  <div class="layout">
    <section>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Buscar produto, variação, marca…" autocomplete="off">
      </div>
      <div id="grid" class="grid-prod" aria-live="polite"></div>
    </section>

    <aside class="card cart">
      <div class="cart-head"><h2 id="cartTit">Venda</h2><span class="cart-count" id="count"></span></div>
      <div class="eu" id="eu" hidden></div>
      <div class="troca-banner" id="trocaBanner" hidden>
        <div><b id="trocaTit"></b><span id="trocaSub"></span></div>
        <button type="button" class="btn ghost sm" id="trocaSair">Sair da troca</button>
      </div>
      <div id="voltouWrap" hidden>
        <div class="sub-h">O que voltou</div><div id="voltou" class="lines"></div>
        <div class="sub-h" style="margin-top:8px">O que leva no lugar</div>
      </div>
      <div id="lines" class="lines"></div>

      <div class="field" id="wrapVend" hidden>
        <label>Quem vendeu</label>
        <div class="vends" id="vends"></div>
        <input type="hidden" id="vend">
      </div>

      <div class="field" id="canalWrap">
        <label>Onde vendeu</label>
        <div class="pays canais" id="canais">
          <button class="pay sel" data-canal="balcao" type="button">Balcão</button>
          <button class="pay" data-canal="whatsapp" type="button">WhatsApp</button>
          <button class="pay" data-canal="instagram" type="button">Instagram</button>
        </div>
        <div class="hint" id="canalAviso" hidden style="margin-top:5px">Venda pela internet conta para o vendedor, mas não gera comissão.</div>
      </div>

      <div class="field" id="wrapAtend" hidden>
        <label for="atend">De qual atendimento</label>
        <select id="atend"></select>
      </div>

      <div class="field cust-wrap">
        <label for="cust">Cliente</label>
        <input id="cust" type="text" placeholder="Nome ou @instagram…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div id="custList" class="cust-list"></div>
        <div id="chip" class="chip" hidden></div>
      </div>

      <div class="field" id="segWrap">
        <label>Pagamento</label>
        <div class="seg" id="seg">
          <button class="seg-b sel" data-st="pago" type="button">Pago</button>
          <button class="seg-b warn" data-st="pendente" type="button">Fiado</button>
        </div>
      </div>

      <div class="field" id="payWrap">
        <label id="payLab">Forma</label>
        <div class="pays" id="pays">
          <button class="pay" data-pay="Pix" type="button">Pix</button>
          <button class="pay" data-pay="Dinheiro" type="button">Espécie</button>
          <button class="pay" data-pay="Crédito" type="button">Crédito</button>
          <button class="pay" data-pay="Débito" type="button">Débito</button>
        </div>
      </div>

      <div class="field" id="discWrap">
        <label for="disc">Desconto (R$)</label>
        <input id="disc" type="number" min="0" step="0.01" placeholder="0,00">
      </div>

      <div class="totals">
        <div class="r"><span id="subLab">Subtotal</span><span class="v" id="sub">R$ 0,00</span></div>
        <div class="r"><span id="dscLab">Desconto</span><span class="v" id="dsc">R$ 0,00</span></div>
        <div class="r big"><span id="totLab">Total</span><span class="v" id="tot">R$ 0,00</span></div>
      </div>
      <button id="finish" class="btn primary" type="button" disabled>Finalizar venda</button>
    </aside>
  </div>
</div>

<dialog id="dlgVendas">
  <form class="dlg" method="dialog" style="padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:min(620px,92vw)">
    <div class="vtop"><h3 id="vTit">Vendas</h3><button class="xbtn" value="close" aria-label="fechar">✕</button></div>
    <div id="vListaWrap" class="vdet">
      <div class="search-wrap"><input id="vBusca" type="search" placeholder="Código (VN-…) ou nome do cliente" autocomplete="off"></div>
      <div class="vfiltros" id="vDias">
        <button type="button" class="seg-b sel" data-d="1">Hoje</button>
        <button type="button" class="seg-b" data-d="7">7 dias</button>
        <button type="button" class="seg-b" data-d="30">30 dias</button>
      </div>
      <div class="vlist" id="vLista"></div>
    </div>
    <div id="vDetalhe" class="vdet" hidden></div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button id="cartBar" class="cart-bar" type="button" hidden>
  <span class="cb-n" id="cbN"></span><span class="cb-t" id="cbT"></span><span class="cb-go">Ver venda ↓</span>
</button>

<script src="/icons.js"></script>
<script src="/nav.js"></script>
<script>
const BRL=(n)=>'R$ '+(Number(n)||0).toFixed(2).replace('.',',');
const S={cart:new Map(),pay:'',status:'pago',cliente:null,prods:[]};
async function api(p,o){const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d;}
const vazio=(ico,t,d)=>`<div class="empty">${ICO(ico,28)}<div class="t">${t}</div><div class="d">${d||''}</div></div>`;
document.querySelector('.search-wrap').insertAdjacentHTML('afterbegin',ICO('busca',17));

/* catálogo */
function estado(v){
  // Sob encomenda: a numeração nunca esgota no site — o que muda é se o
  // par está aqui ou se você busca no fornecedor.
  if(v.on_demand)return v.real_stock>0?['ok','na loja']:['enc','encomenda'];
  if(!v.stock_management)return['ok','disponível'];
  if(v.stock<=0)return['out','esgotado'];
  if(v.stock===1)return['low','última'];   // roupa: 1 ou 2 por tamanho, a última é que importa
  return['ok',v.stock+' un.'];
}
const sobEnc=(v)=>v.on_demand&&(v.real_stock||0)<=0;
async function carregar(q=''){
  document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+ICO('sync',26)+'<div class="t">Carregando…</div></div>';
  S.prods=await api('/api/products?q='+encodeURIComponent(q));
  const g=document.getElementById('grid');
  if(!S.prods.length){g.innerHTML='<div style="grid-column:1/-1">'+vazio('busca','Nada encontrado','Tente outro nome, marca ou variação.')+'</div>';return;}
  g.innerHTML='';
  for(const v of S.prods){
    const [cls,txt]=estado(v), out=!v.on_demand&&v.stock_management&&v.stock<=0;
    const b=document.createElement('button');b.className='prod';b.type='button';b.disabled=out;
    const img=v.image_url?`<img src="${v.image_url}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICO('estoque',22)}))">`:ICO('estoque',22);
    b.innerHTML=`<span class="thumb">${img}</span><span class="nm">${v.product_name}</span>
      <span class="vr">${v.variant_name||''}${v.brand?' · '+v.brand:''}</span>
      <span class="bot"><span class="pr">${BRL(v.price)}</span><span class="st ${cls}">${txt}</span></span>`;
    b.addEventListener('click',()=>{add(v);b.classList.remove('foi');void b.offsetWidth;b.classList.add('foi');});g.appendChild(b);
  }
}
function add(v){const c=S.cart.get(v.id)||{v,qty:0};
  // Sob encomenda não tem limite: o que faltar é buscado no fornecedor.
  if(!v.on_demand&&v.stock_management&&c.qty>=v.stock)return toast('Estoque no limite',`Só há ${v.stock} un. deste item.`,true);
  c.qty++;S.cart.set(v.id,c);renderCart();
  if(sobEnc(v))toast('Vai por encomenda',`${v.product_name} ${v.variant_name} não está na loja — o sistema cria o lembrete de pegar no fornecedor.`);}
function qty(id,d){const it=S.cart.get(id);if(!it)return;it.qty+=d;
  if(it.qty<=0)S.cart.delete(id);
  else if(!it.v.on_demand&&it.v.stock_management&&it.qty>it.v.stock){it.qty=it.v.stock;toast('Estoque no limite',`Máximo ${it.v.stock} un.`,true);}
  renderCart();}
function renderCart(){
  const box=document.getElementById('lines');
  const n=[...S.cart.values()].reduce((s,i)=>s+i.qty,0);
  document.getElementById('count').textContent=n?n+' '+pl(n,'item','itens'):'';
  if(!S.cart.size){box.innerHTML=S.troca?'<div class="aviso-site">Toque nos produtos que o cliente vai levar (ou só marque o que voltou, se for devolução).</div>'
    :vazio('pdv','Carrinho vazio','Toque num produto para começar a venda.');}
  else{box.innerHTML='';
    for(const [id,it] of S.cart){
      const el=document.createElement('div');el.className='line';
      el.innerHTML=`<div><div class="nm">${it.v.product_name}</div>
        <div class="meta">${it.v.variant_name||''} · ${BRL(it.v.price)}${sobEnc(it.v)?' · <b class="enc">encomenda</b>':''}</div>
        <button class="rm" type="button">remover</button></div>
        <div><div class="qty"><button type="button" aria-label="menos">−</button><span>${it.qty}</span><button type="button" aria-label="mais">+</button></div>
        <div class="lt">${BRL(it.v.price*it.qty)}</div></div>`;
      const [m,p]=el.querySelectorAll('.qty button');
      m.onclick=()=>qty(id,-1);p.onclick=()=>qty(id,1);
      el.querySelector('.rm').onclick=()=>{S.cart.delete(id);renderCart();};
      box.appendChild(el);
    }}
  totais();
}
function totais(){
  if(S.troca)return totaisTroca();
  let sub=0;for(const [,it] of S.cart)sub+=it.v.price*it.qty;
  const d=Math.max(0,parseFloat(document.getElementById('disc').value)||0);
  document.getElementById('sub').textContent=BRL(sub);
  document.getElementById('dsc').textContent=BRL(d);
  document.getElementById('tot').textContent=BRL(Math.max(0,sub-d));
  document.getElementById('finish').disabled=!S.cart.size;
  barra(Math.max(0,sub-d));
}
/* barra do celular: some quando a venda já está na tela */
let vendaNaTela=false, nAntes=0;
new IntersectionObserver(([e])=>{vendaNaTela=e.isIntersecting;barra();},{threshold:.25}).observe(document.querySelector('.cart'));
function barra(total){
  const bar=document.getElementById('cartBar');
  const n=[...S.cart.values()].reduce((s,i)=>s+i.qty,0);
  if(total!==undefined){
    document.getElementById('cbN').textContent=n+(n===1?' item':' itens');
    document.getElementById('cbT').textContent=BRL(total);
    if(n>nAntes){bar.classList.remove('bump');void bar.offsetWidth;bar.classList.add('bump');}
    nAntes=n;
  }
  bar.hidden=!n||vendaNaTela;
  document.body.classList.toggle('tem-barra',!!n);
}
document.getElementById('cartBar').addEventListener('click',()=>
  document.querySelector('.cart').scrollIntoView({behavior:'smooth',block:'start'}));

/* cliente */

async function buscarCliente(q){
  if(!q){cl.classList.remove('show');return;}

  cl.innerHTML='';
  rows.slice(0,6).forEach(c=>{const b=document.createElement('button');b.type='button';

    const ig=c.instagram||'',ap=igual(c.name,ig)?'':ig;
    b.innerHTML=`<span>${esc(rotulo(c))}</span>
      <span class="num" style="color:var(--ink-3);font-size:11px">${esc(ap||c.phone||'')}</span>`;
    b.onclick=()=>selCliente(c);cl.appendChild(b);});
  const nb=document.createElement('button');nb.type='button';nb.className='new';
  nb.innerHTML=ICO('mais',15)+`<span style="flex:1;text-align:left">Criar “${esc(q)}”</span>`;
  nb.style.gap='7px';nb.onclick=()=>criarCliente(q);cl.appendChild(nb);
  cl.classList.add('show');
}
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm=(s)=>String(s||'').trim().toLowerCase().replace(/^@+/,'');
const igual=(a,b)=>Boolean(b)&&nrm(a)===nrm(b);
// Se o cadastro é só o @, mostra o @; senão o nome.
const rotulo=(c)=>igual(c.name,c.instagram)?c.instagram:c.name;
function selCliente(c){S.cliente=c;ch.hidden=false;
  const ig=c.instagram&&!igual(c.name,c.instagram)?` <span class="ig">${esc(c.instagram)}</span>`:'';
  ch.innerHTML=ICO('clientes',15)+`<span>${esc(rotulo(c))}${ig}</span><button type="button" aria-label="remover">✕</button>`;
  ch.querySelector('button').onclick=limparCliente;cl.classList.remove('show');ci.value='';}
function limparCliente(){S.cliente=null;ch.hidden=true;ch.innerHTML='';}
async function criarCliente(nome){
  // Digitou "@fulano"? Já entra como Instagram também.
  try{const r=await api('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:nome,instagram:nome.trim().startsWith('@')?nome.trim():''})});
    selCliente(r.customer);toast('Cliente criado',rotulo(r.customer));}catch(e){toast('Erro',e.message,true);}
}

/* quem vendeu — o vendedor logado é o dono da venda; o dono escolhe */
(async()=>{
  if(quem.papel==='vendedor'){
    const eu=document.getElementById('eu');
    eu.innerHTML=`Vendendo como <b>${esc(quem.nome)}</b> · a venda e a comissão são suas`;eu.hidden=false;
    document.getElementById('abrirVendas').textContent='Vendas · trocar';
    return;
  }
  try{
    const t=await api('/api/team');
    TIME=t.membros.filter(m=>m.active&&m.vende);
    if(!TIME.length)return;
    // Uma pessoa só vendendo: não há o que escolher.
    if(TIME.length===1){document.getElementById('vend').value=String(TIME[0].id);}
    pintarVendedores();
    document.getElementById('wrapVend').hidden=false;
    atendimentos();
  }catch(_){}
})();
// Quem lança é o gerente, para vários vendedores: o sistema NÃO lembra o
// último (a próxima venda pode ser de outra pessoa). Cada venda pede o nome.
let TIME=[];
function pintarVendedores(){
  const atual=document.getElementById('vend').value;
  document.getElementById('vends').innerHTML=TIME.map(m=>
    `<button class="pay${String(m.id)===atual?' sel':''}" data-v="${m.id}" type="button">${esc(m.name.split(' ')[0])}</button>`).join('')
    +`<button class="pay loja${atual==='loja'?' sel':''}" data-v="loja" type="button" title="Venda sem vendedor: não gera comissão">Loja</button>`;
}
document.getElementById('vends').onclick=e=>{const b=e.target.closest('.pay');if(!b)return;
  document.getElementById('vend').value=b.dataset.v;pintarVendedores();
  document.getElementById('wrapVend').classList.remove('falta');atendimentos();};

// Fecha o funil: se essa venda veio de um atendimento que já estava
// aberto, dá para amarrar os dois aqui e a conversão sai certa.
async function atendimentos(){
  const w=document.getElementById('wrapAtend'),sel=document.getElementById('atend');
  const v=document.getElementById('vend').value;
  w.hidden=true;sel.innerHTML='';
  if(!v||v==='loja')return;
  try{
    // Vale o que é dele e também o que ficou sem dono — senão um
    // atendimento anotado às pressas não teria como ser fechado aqui.
    const d=await api('/api/atendimentos?days=30');
    const abertos=d.linhas.filter(a=>(a.stage==='atendimento'||a.stage==='proposta')
      &&(!a.member_id||String(a.member_id)===String(v)));
    if(!abertos.length)return;
    sel.innerHTML='<option value="">— venda nova —</option>'+abertos.map(a=>
      `<option value="${a.id}">${esc(a.nome||a.instagram||'sem nome')}${a.querendo?' — '+esc(a.querendo):''}</option>`).join('');
    w.hidden=false;
  }catch(_){}
}

/* onde vendeu — toda venda começa no balcão (o mais comum); venda do
   WhatsApp/Instagram o gerente marca na hora. Lembrar o último faria a
   venda seguinte do balcão sair como internet. */
S.canal='balcao';
function pintarCanal(){document.querySelectorAll('#canais .pay').forEach(b=>b.classList.toggle('sel',b.dataset.canal===S.canal));
  const av=document.getElementById('canalAviso');if(av)av.hidden=S.canal==='balcao'||!TIME.length;}
pintarCanal();
document.getElementById('canais').onclick=e=>{const b=e.target.closest('.pay');if(!b)return;
  S.canal=b.dataset.canal;pintarCanal();};

/* controles */
document.getElementById('seg').onclick=e=>{const b=e.target.closest('.seg-b');if(!b)return;
  document.querySelectorAll('.seg-b').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.status=b.dataset.st;
  document.getElementById('payWrap').style.opacity=S.status==='pendente'?'.5':'1';};
document.getElementById('pays').onclick=e=>{const b=e.target.closest('.pay');if(!b)return;

let tt;function toast(t,d,err){const el=document.getElementById('toast');
  el.className='toast'+(err?' err':'');el.innerHTML=`<div class="t">${t}</div><div class="d">${d||''}</div>`;
  requestAnimationFrame(()=>el.classList.add('show'));clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),4600);}

async function finalizar(){
  if(S.troca)return confirmarTroca();
  if(!S.cart.size)return;
  // Venda paga sem forma: o caixa do dia não teria onde pôr o dinheiro.
  if(S.status==='pago'&&!S.pay)return toast('Escolha a forma','Pix, Espécie, Crédito ou Débito — é por ela que o caixa fecha.',true);
  // Com equipe cadastrada, toda venda tem dono (ou "Loja"): é a comissão.
  if(TIME.length&&!document.getElementById('vend').value){
    const w=document.getElementById('wrapVend');w.classList.add('falta');
    w.scrollIntoView({behavior:'smooth',block:'center'});
    return toast('Quem vendeu?','Toque no nome de quem fez a venda — ou em Loja, se ninguém ganha comissão.',true);
  }
  const btn=document.getElementById('finish');btn.disabled=true;btn.textContent='Lançando…';
  const items=[...S.cart.values()].map(i=>({variant_id:i.v.id,qty:i.qty}));
  try{
    const r=await api('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      items,customer_id:S.cliente?S.cliente.id:null,payment_method:S.pay,payment_status:S.status,
      seller_id:(v=>v&&v!=='loja'?v:null)(document.getElementById('vend').value),canal:S.canal,
      atendimento_id:document.getElementById('atend').value||null,
      discount:parseFloat(document.getElementById('disc').value)||0})});
    const vend=r.vendedor?' · '+r.vendedor:'';
    const sit=r.payment_status==='pendente'?'Fiado — foi para Contas a receber':'Pago';
    // Só diz que mexeu no site quando mexeu: sob encomenda mantém a grade de propósito.
    const sinc=r.mode==='demo'?'':(!r.stock_synced?(r.stock_na_fila?' · estoque sobe para a loja na próxima rodada':' · estoque não sincronizou')
      :(r.stock_enviados>0?' · estoque atualizado na loja':' · grade do site mantida'));
    const enc=(r.encomendas&&r.encomendas.length)
      ? `<br><b style="color:var(--warn)">Pegar no fornecedor hoje:</b> ${r.encomendas.join(', ')}` : '';
    toast(`${r.code} · ${BRL(r.total)}`,`${r.customer_name||'Sem cliente'}${vend} · ${sit}${sinc}${enc}`);
    S.cart.clear();S.pay='';limparCliente();
    // A próxima venda começa do zero: balcão e sem vendedor escolhido.
    if(TIME.length>1)document.getElementById('vend').value='';
    pintarVendedores();S.canal='balcao';pintarCanal();
    document.querySelectorAll('#pays .pay').forEach(p=>p.classList.remove('sel'));
    document.getElementById('disc').value='';renderCart();
    atendimentos();
    await carregar(document.getElementById('search').value.trim());
  }catch(e){toast('Não deu pra lançar',e.message,true);}
  finally{btn.textContent='Finalizar venda';btn.disabled=!S.cart.size;}
}
/* ---------- Vendas: achar, trocar, cancelar ---------- */
const dlgV=document.getElementById('dlgVendas');
let vDias=1;
const quando=(iso)=>new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const CANAL_TXT={balcao:'Balcão',whatsapp:'WhatsApp',instagram:'Instagram'};
const origemTxt=(v)=>v.channel!=='site'?(CANAL_TXT[v.canal]||'Balcão'):(v.origem==='balcao'?'PDV Nuvemshop':'Site');
const statusTxt=(v)=>v.payment_status==='cancelado'?'cancelada'
  :v.payment_status==='pendente'?(v.channel==='site'?'aguardando pagamento':'fiado'):(v.payment_method||'pago');
document.querySelector('#vListaWrap .search-wrap').insertAdjacentHTML('afterbegin',ICO('busca',17));
document.getElementById('abrirVendas').onclick=()=>{dlgV.showModal();mostrarLista();};
document.getElementById('vDias').onclick=(e)=>{const b=e.target.closest('.seg-b');if(!b)return;
  document.querySelectorAll('#vDias .seg-b').forEach(x=>x.classList.toggle('sel',x===b));vDias=+b.dataset.d;mostrarLista();};
let vt;document.getElementById('vBusca').oninput=()=>{clearTimeout(vt);vt=setTimeout(mostrarLista,220);};
async function mostrarLista(){
  document.getElementById('vTit').textContent='Vendas';
  document.getElementById('vDetalhe').hidden=true;document.getElementById('vListaWrap').hidden=false;
  const q=document.getElementById('vBusca').value.trim();
  const box=document.getElementById('vLista');
  try{
    // Buscando um código ou cliente, olha mais para trás.
    const rows=await api(`/api/vendas?dias=${q?120:vDias}&q=${encodeURIComponent(q)}`);
    box.innerHTML=rows.length?rows.map(v=>`<button type="button" class="vrow${v.payment_status==='cancelado'?' canc':''}" data-id="${v.id}">
      <span class="c">${esc(v.code)}</span>
      <span class="n">${esc(v.customer_name||'Sem cliente')}<small>${quando(v.created_at)} · ${origemTxt(v)}${v.trocas?` · ${v.trocas} ${pl(v.trocas,'troca')}`:''}</small></span>
      <span class="t">${BRL(v.total)}<small>${esc(statusTxt(v))}</small></span></button>`).join('')
      :vazio('recibo','Nenhuma venda aqui',q?'Confira o código ou o nome.':'Escolha outro período ou busque pelo código.');
  }catch(e){box.innerHTML=vazio('alerta','Não deu para carregar',e.message);}
}
document.getElementById('vLista').onclick=(e)=>{const b=e.target.closest('.vrow');if(b)abrirVenda(b.dataset.id);};
async function abrirVenda(id){
  const v=await api('/api/vendas/'+id);
  document.getElementById('vListaWrap').hidden=true;
  const box=document.getElementById('vDetalhe');box.hidden=false;
  document.getElementById('vTit').textContent=v.code;
  const linha=(i)=>{
    if(i.qty<0)return `<div class="vitem volta"><span>↩ Voltou: ${esc(i.name)} <span class="q">×${-i.qty}</span></span><span class="v">− ${BRL(-i.line_total)}</span></div>`;
    const volt=i.qty-(i.pode_voltar??i.qty);
    return `<div class="vitem${i.troca_id?' nova':''}"><span>${i.troca_id?'Levou na troca: ':''}${esc(i.name)} <span class="q">×${i.qty} · ${BRL(i.unit_price)}${volt?` · ${volt} voltou`:''}</span></span>
      <span class="v">${BRL(i.line_total)}</span></div>`;
  };
  const pago=v.payment_status==='pago';
  box.innerHTML=`<button type="button" class="btn ghost sm" id="vVoltar" style="width:fit-content">← Todas as vendas</button>
    <div class="meta"><b>${esc(v.customer_name||'Sem cliente')}</b> · ${quando(v.created_at)} · ${origemTxt(v)}
      ${v.channel!=='site'&&TIME.length&&quem.papel==='dono'?'':(v.seller_name?` · vendeu: <b>${esc(v.seller_name)}</b>`:'')}<br>
      ${v.payment_status==='cancelado'?`<b style="color:var(--crit)">Cancelada</b> em ${quando(v.cancelado_em)}${v.cancel_motivo?' · '+esc(v.cancel_motivo):''}`
        :pago?`Pago · ${esc(v.payment_method||'')}`:`<b style="color:var(--warn)">${v.channel==='site'?'Aguardando pagamento':'Fiado — a receber'}</b>`}
      ${v.discount?` · desconto ${BRL(v.discount)}`:''}</div>
    ${v.channel!=='site'&&quem.papel==='dono'?`<label class="meta vvend">Onde vendeu
      <select id="vCanal">${Object.entries(CANAL_TXT).map(([k,t])=>`<option value="${k}"${(v.canal||'balcao')===k?' selected':''}>${t}</option>`).join('')}</select></label>`:''}
    ${v.channel!=='site'&&TIME.length&&quem.papel==='dono'?`<label class="meta vvend">Quem vendeu
      <select id="vVend"><option value="">Loja (sem comissão)</option>${TIME.map(m=>`<option value="${m.id}"${m.id===v.seller_id?' selected':''}>${esc(m.name)}</option>`).join('')}
      ${v.seller_id&&!TIME.some(m=>m.id===v.seller_id)?`<option value="${v.seller_id}" selected>${esc(v.seller_name||'')}</option>`:''}</select></label>`:''}
    <div class="vdet" style="gap:5px">${(v.itens||[]).map(linha).join('')||'<div class="aviso-site">Pedido sem as peças registradas.</div>'}</div>
    <div class="meta">Total: <b style="font-family:var(--font-mono);font-size:15px">${BRL(v.total)}</b>
      ${v.trocas.length?` · ${v.trocas.length} ${pl(v.trocas.length,'troca')}`:''}</div>
    ${v.pode_mexer?`<div class="vacoes">
        <button type="button" class="btn primary" id="vTrocar">Trocar ou devolver</button>
        ${quem.papel==='dono'?'<button type="button" class="btn danger" id="vCancelar">Cancelar venda</button>':''}</div>
      <div class="vcanc" id="vCancBox" hidden>
        <b>Cancelar ${esc(v.code)}?</b>
        <span class="meta">As peças voltam para o estoque (aqui e no site)${pago?` e ${BRL(v.total)} saem do caixa de hoje como estorno`:''}. A venda sai de metas e relatórios.</span>
        <input id="vMotivo" placeholder="Motivo (opcional) — ex.: cliente desistiu">
        ${pago?`<label class="meta">Devolvido em <select id="vForma">${['Pix','Dinheiro','Crédito','Débito'].map(f=>`<option${f===v.payment_method?' selected':''}>${f}</option>`).join('')}</select></label>`:''}
        <div class="vacoes"><button type="button" class="btn danger" id="vConfirmar">Confirmar cancelamento</button>
          <button type="button" class="btn ghost" id="vDesistir">Voltar</button></div>
      </div>`
    :v.channel==='site'?`<div class="aviso-site">Pedido da Nuvemshop: cancelamento e troca são feitos lá, e o sistema acompanha sozinho.</div>`:''}`;
  document.getElementById('vVoltar').onclick=mostrarLista;
  // Marcou o canal errado? Balcão gera comissão; internet não.
  const vc=document.getElementById('vCanal');
  if(vc)vc.onchange=async()=>{
    try{const r=await api(`/api/sales/${v.id}/vendedor`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({canal:vc.value})});v.canal=r.canal;
      toast(v.code,`Agora é venda de ${CANAL_TXT[r.canal]}${r.canal==='balcao'?' (gera comissão)':' (sem comissão)'}.`);}
    catch(e){toast('Não deu para trocar',e.message,true);vc.value=v.canal||'balcao';}
  };
  // Lançou no nome errado? Corrige aqui — a comissão vai junto para a pessoa certa.
  const vv=document.getElementById('vVend');
  if(vv)vv.onchange=async()=>{
    const nome=vv.value?vv.options[vv.selectedIndex].text:'a loja';
    if(!confirm(`Passar ${v.code} para ${nome}?\n\nA comissão desta venda (e de trocas dela) vai junto. Se a comissão do mês já foi paga, a Equipe mostra a diferença para acertar.`)){
      vv.value=v.seller_id||'';return;}
    try{await api(`/api/sales/${v.id}/vendedor`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({seller_id:vv.value||null})});toast(v.code,'Agora é de '+nome+'.');v.seller_id=vv.value?Number(vv.value):null;}
    catch(e){toast('Não deu para trocar',e.message,true);vv.value=v.seller_id||'';}
  };
  if(!v.pode_mexer)return;
  document.getElementById('vTrocar').onclick=()=>iniciarTroca(v);
  // Cancelar devolve dinheiro do caixa: só o dono (o servidor também barra).
  if(!document.getElementById('vCancelar'))return;
  document.getElementById('vCancelar').onclick=()=>{document.getElementById('vCancBox').hidden=false;};
  document.getElementById('vDesistir').onclick=()=>{document.getElementById('vCancBox').hidden=true;};
  document.getElementById('vConfirmar').onclick=async(e)=>{
    e.target.disabled=true;
    try{
      const r=await api(`/api/sales/${v.id}/cancelar`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({motivo:document.getElementById('vMotivo').value,forma:document.getElementById('vForma')?.value})});
      toast(`${r.code} cancelada`,r.estorno?`Estorno de ${BRL(r.estorno)} em ${r.forma}. As peças voltaram para o estoque.`:'As peças voltaram para o estoque.');
      abrirVenda(v.id);carregar(document.getElementById('search').value.trim());
    }catch(err){toast('Não deu para cancelar',err.message,true);e.target.disabled=false;}
  };
}

// Troca: o carrinho vira "o que voltou" (da venda) + "o que leva" (o
// catálogo de sempre). A diferença sai na hora, para mais ou para menos.
function iniciarTroca(v){
  S.troca={venda:v,voltou:new Map(),fator:v.subtotal>0?Math.max(0,(v.subtotal-v.discount)/v.subtotal):1};
  dlgV.close();S.cart.clear();limparCliente();
  document.body.classList.add('modo-troca');
  document.getElementById('trocaBanner').hidden=false;document.getElementById('voltouWrap').hidden=false;
  document.getElementById('trocaTit').textContent='Troca da venda '+v.code;
  document.getElementById('trocaSub').textContent=(v.customer_name||'Sem cliente')+(v.payment_status==='pendente'?' · fiado':'');
  document.getElementById('cartTit').textContent='Troca';
  document.getElementById('payLab').textContent='Forma da diferença';
  document.getElementById('subLab').textContent='Leva';document.getElementById('dscLab').textContent='Voltou';
  S.pay='';document.querySelectorAll('#pays .pay').forEach(p=>p.classList.remove('sel'));
  renderVoltou();renderCart();
  document.querySelector('.cart').scrollIntoView({behavior:'smooth',block:'start'});
}
function sairTroca(){
  S.troca=null;S.cart.clear();document.body.classList.remove('modo-troca');
  document.getElementById('trocaBanner').hidden=true;document.getElementById('voltouWrap').hidden=true;
  document.getElementById('cartTit').textContent='Venda';document.getElementById('payLab').textContent='Forma';
  document.getElementById('subLab').textContent='Subtotal';document.getElementById('dscLab').textContent='Desconto';
  document.getElementById('totLab').textContent='Total';document.getElementById('payWrap').style.opacity='1';
  document.getElementById('finish').textContent='Finalizar venda';
  renderCart();
}
document.getElementById('trocaSair').onclick=sairTroca;
const precoVolta=(i)=>Math.round(i.unit_price*S.troca.fator*100)/100;
function renderVoltou(){
  const box=document.getElementById('voltou');
  const itens=S.troca.venda.itens.filter(i=>i.qty>0&&i.pode_voltar>0);
  if(!itens.length){box.innerHTML='<div class="aviso-site">Nada desta venda pode voltar.</div>';return;}
  box.innerHTML=itens.map(i=>{const q=S.troca.voltou.get(i.id)||0;
    return `<div class="line"><div><div class="nm">${esc(i.name)}</div>
      <div class="meta">${BRL(precoVolta(i))} · pode voltar ${i.pode_voltar}</div></div>
      <div><div class="qty"><button type="button" data-i="${i.id}" data-d="-1">−</button><span>${q}</span>
        <button type="button" data-i="${i.id}" data-d="1">+</button></div>
      <div class="lt">${q?'− '+BRL(precoVolta(i)*q):''}</div></div></div>`;}).join('');
}
document.getElementById('voltou').onclick=(e)=>{const b=e.target.closest('button[data-i]');if(!b)return;
  const i=S.troca.venda.itens.find(x=>x.id===+b.dataset.i);
  const q=Math.min(i.pode_voltar,Math.max(0,(S.troca.voltou.get(i.id)||0)+(+b.dataset.d)));
  S.troca.voltou.set(i.id,q);renderVoltou();totais();};
function totaisTroca(){
  let leva=0;for(const [,it] of S.cart)leva+=it.v.price*it.qty;
  let volta=0;for(const i of S.troca.venda.itens)volta+=precoVolta(i)*(S.troca.voltou.get(i.id)||0);
  const dif=Math.round((leva-volta)*100)/100;
  document.getElementById('sub').textContent=BRL(leva);
  document.getElementById('dsc').textContent='− '+BRL(volta);
  document.getElementById('totLab').textContent=dif>0?'Cliente paga':dif<0?'Devolver ao cliente':'Diferença';
  document.getElementById('tot').textContent=BRL(Math.abs(dif));
  const algo=S.cart.size||volta>0;
  const btn=document.getElementById('finish');btn.disabled=!algo;btn.textContent='Confirmar troca';
  document.getElementById('payWrap').style.opacity=dif===0||S.troca.venda.payment_status!=='pago'?'.5':'1';
  barra(Math.abs(dif));
  return dif;
}
async function confirmarTroca(){
  const t=S.troca,dif=totaisTroca();
  if(dif!==0&&t.venda.payment_status==='pago'&&!S.pay)
    return toast('Escolha a forma',dif>0?'Como o cliente pagou a diferença?':'Como o dinheiro foi devolvido?',true);
  const btn=document.getElementById('finish');btn.disabled=true;btn.textContent='Lançando…';
  try{
    const r=await api(`/api/sales/${t.venda.id}/troca`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      devolver:[...t.voltou].filter(([,q])=>q>0).map(([item_id,qty])=>({item_id,qty})),
      levar:[...S.cart.values()].map(i=>({variant_id:i.v.id,qty:i.qty})),forma:S.pay})});
    const enc=r.encomendas&&r.encomendas.length?`<br><b style="color:var(--warn)">Pegar no fornecedor:</b> ${r.encomendas.join(', ')}`:'';
    toast(`Troca feita · ${r.code}`,(r.diferenca>0?`Cliente pagou ${BRL(r.diferenca)}`:r.diferenca<0?`Devolvido ${BRL(-r.diferenca)}`:'Sem diferença de valor')+enc);
    sairTroca();carregar(document.getElementById('search').value.trim());
  }catch(e){toast('Não deu para trocar',e.message,true);btn.disabled=false;btn.textContent='Confirmar troca';}
}

let st;document.getElementById('search').oninput=e=>{clearTimeout(st);st=setTimeout(()=>carregar(e.target.value.trim()),200);};
document.getElementById('finish').onclick=finalizar;
renderCart();carregar();
</script>
</body>
