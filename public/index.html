<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070907">
<title>VN Store — Início</title>
<link rel="icon" href="/logo.webp">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Gráfico */
  .chart-card{padding:var(--s4) var(--s4) var(--s3)}
  .chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s1)}
  .chart-head h3{margin:0}
  .chart-wrap{position:relative;width:100%}
  #chart{display:block;width:100%;height:auto;touch-action:none;overflow:visible}
  #chart .bar{fill:url(#barGrad);transition:opacity var(--t-fast)}
  #chart .bar.today{fill:url(#barToday)}
  #chart .bar.zero{fill:var(--line-str);opacity:.5}
  #chart .grid{stroke:var(--line-soft);stroke-dasharray:3 6}
  #chart .base{stroke:var(--line)}
  #chart .lbl{fill:var(--ink-3);font-size:10.5px;font-family:var(--font-mono)}
  #chart .lbl.today{fill:var(--brand-hi);font-weight:700}
  #chart .hit{fill:transparent;cursor:pointer}
  #chart .hit:hover + .bar,#chart .bar:hover{opacity:.75}
  .tip{position:absolute;pointer-events:none;z-index:5;padding:8px 11px;border-radius:10px;
    background:var(--surface-3);border:1px solid var(--brand);box-shadow:var(--sh-2),0 0 16px var(--glow);
    transform:translate(-50%,-118%);white-space:nowrap}
  .tip .d{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .tip .v{font-family:var(--font-mono);font-weight:700;color:var(--brand-hi);font-size:15px;margin-top:2px}
  .tip .n{color:var(--ink-3);font-size:11px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}

  /* Maestro */
  .maestro{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:start;padding:var(--s5);
    position:relative;overflow:hidden;
    background:radial-gradient(460px 220px at 100% 0%,rgba(47,210,79,.1),transparent 68%),
      linear-gradient(180deg,var(--surface-2),var(--surface))}
  .m-ava{width:56px;height:56px;border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 35% 30%,#1D4A28,#0A1A0F);
    border:1px solid rgba(47,210,79,.35);box-shadow:0 0 22px var(--glow)}
  .m-ava img{width:78%;height:78%;object-fit:contain}
  .m-body h3{margin:0;font-family:var(--font-disp);font-weight:900;text-transform:uppercase;
    letter-spacing:.5px;font-size:19px;transform:skewX(-6deg)}
  .m-role{color:var(--brand-hi);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
  .m-body p{margin:var(--s3) 0 0;max-width:62ch;color:var(--ink-2);line-height:1.6}
  .m-body p b{color:var(--ink);font-weight:700}
  .m-body p .hl{color:var(--brand-hi)}
  .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
  .m-link{font-family:var(--font-mono);font-size:11.5px;color:var(--brand-hi);text-decoration:none}
  .m-link:hover{text-decoration:underline}
  .m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
  .m-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;
    border-radius:999px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-2);text-decoration:none}
  .m-tag:hover{border-color:var(--line-str)}
  .m-tag.crit{color:var(--crit);border-color:rgba(242,86,74,.35);background:rgba(242,86,74,.08)}
  .m-tag.warn{color:var(--warn);border-color:rgba(232,163,23,.35);background:rgba(232,163,23,.08)}
  .m-tag.ok{color:var(--ok);border-color:rgba(53,192,138,.3);background:rgba(53,192,138,.08)}
  @media (max-width:560px){.maestro{grid-template-columns:1fr}}

  .settle{display:flex;align-items:center;gap:var(--s3)}

  /* Filas de trabalho */
  .filas{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
  .fila{display:flex;align-items:center;gap:var(--s3);padding:14px var(--s4);text-align:left;cursor:pointer;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);
    border-radius:var(--r-lg);transition:var(--t-fast);font-family:var(--font-body)}
  .fila:hover{border-color:rgba(47,210,79,.4);transform:translateY(-1px);box-shadow:var(--sh-2)}
  .fila .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .fila .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;line-height:1.1}
  .fila .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .fila.zero{opacity:.55}
  .fila.zero .n{color:var(--ink-2)}
  .fila.alerta .n{color:var(--warn)}

  /* Abas de período */
  .per-wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
    border-bottom:1px solid var(--line);margin-bottom:var(--s4);flex-wrap:wrap}
  .tabs{display:flex;gap:var(--s1)}
  .tabs button{padding:9px 15px;border:none;background:none;color:var(--ink-3);cursor:pointer;
    font-size:13.5px;font-weight:700;font-family:var(--font-body);position:relative;transition:var(--t-fast)}
  .tabs button:hover{color:var(--ink)}
  .tabs button.sel{color:var(--brand-hi)}
  .tabs button.sel::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;
    background:var(--brand);border-radius:2px 2px 0 0;box-shadow:0 0 8px var(--glow)}
  .auto{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);padding-bottom:6px}
  .auto .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulse 2.4s ease-in-out infinite}

  /* Modal de fila */
  .dlgf{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:min(560px,94vw);max-height:80vh}
  .dlgf h3{margin:0;font-family:var(--font-disp);text-transform:uppercase;font-size:19px;transform:skewX(-5deg)}
  .dlgf .lst{display:flex;flex-direction:column;gap:6px;overflow-y:auto}
</style>
</head>
<body>
<div class="app">

  <div class="pagehead">
    <div>
      <h1>Início</h1>
      <div class="ph-sub">Visão geral da loja</div>
    </div>
    <div class="ph-actions"><a class="btn primary" href="/pdv" id="pdvLink">Abrir PDV</a></div>
  </div>

  <div class="card maestro" style="margin-bottom:var(--s4)">
    <div class="m-ava"><img src="/logo.webp" alt=""></div>
    <div class="m-body">
      <div class="m-top"><h3>Maestro</h3><a href="/agentes" class="m-link">ver o time →</a></div>
      <div class="m-role">Gerente-geral · coordena os agentes</div>
      <p id="maestroMsg"><span class="sk">Lendo os números da loja…</span></p>
      <div class="m-tags" id="maestroTags"></div>
    </div>
  </div>

  <!-- Filas de trabalho: o que precisa de ação agora -->
  <div class="filas" id="filas"></div>

  <!-- Números do período -->
  <div class="per-wrap">
    <div class="tabs" id="tabs">
      <button data-p="hoje" class="sel" type="button">Hoje</button>
      <button data-p="ontem" type="button">Ontem</button>
      <button data-p="semana" type="button">Esta semana</button>
    </div>
    <span class="auto" id="auto"></span>
  </div>
  <div class="kpis" id="kpis"></div>

  <div class="card chart-card" style="margin-top:var(--s3)">
    <div class="chart-head">
      <h3>Vendas por dia</h3>
      <span class="meta num" id="chartSub">últimos 14 dias</span>
    </div>
    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" role="img" aria-label="Vendas por dia"></svg>
      <div id="tip" class="tip" hidden></div>
    </div>
  </div>

  <div class="cols" style="margin-top:var(--s3)">
    <div class="card panel">
      <h3>Últimas vendas</h3>
      <div class="rows" id="recent"></div>
    </div>
    <div class="card panel">
      <h3>Estoque no vermelho</h3>
      <div class="rows" id="low"></div>
    </div>
  </div>


  <div class="cols" style="margin-top:var(--s3)">
    <div class="card panel">
      <h3>Contas a receber</h3>
      <div class="rows" id="recv"></div>
    </div>
    <div class="card panel">
      <h3>Lembretes</h3>
      <div class="rows" id="rem"></div>
    </div>
  </div>

</div>

<dialog id="dlgFila">
  <form class="dlgf" method="dialog">
    <h3 id="fTit">Fila</h3>
    <div class="lst rows" id="fLista"></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn ghost" value="ok" type="submit">Fechar</button></div>
  </form>
</dialog>

<script src="/icons.js"></script>
<script src="/nav.js"></script>
<script>
const BRL=(n)=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const DATA=(s)=>new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
async function api(p,o){const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d;}
const vazio=(ico,t,d)=>`<div class="empty">${ICO(ico,30)}<div class="t">${t}</div><div class="d">${d||''}</div></div>`;

/* ---------- KPIs ---------- */
function kpi(o){
  return `<div class="kpi ${o.mod||''}">
    <div class="kpi-top">
      <span class="label">${o.label}</span>
      <span class="ico-box ${o.tone||''}" style="width:30px;height:30px">${ICO(o.ico,16)}</span>
    </div>
    <div class="kpi-val">${o.val}</div>
    <div class="kpi-sub">${o.subIco?ICO(o.subIco,13):''}<span>${o.sub}</span></div>
  </div>`;
}
let OP=null, periodo='hoje', DASH=null;

const FILAS=[
  {k:'por_cobrar',ico:'financeiro',lab:'Por cobrar',tit:'Aguardando pagamento'},
  {k:'por_embalar',ico:'estoque',lab:'Por embalar',tit:'Pagos, aguardando separação'},
  {k:'por_enviar',ico:'entrega',lab:'Por enviar',tit:'Embalados, aguardando despacho'},
  {k:'por_retirar',ico:'pdv',lab:'Por retirar',tit:'Retirada na loja'},
];
function renderFilas(){
  if(!OP) return;
  document.getElementById('filas').innerHTML=FILAS.map(f=>{
    const v=OP.filas[f.k]||{n:0,t:0};
    const zero=v.n===0;
    return `<button class="fila ${zero?'zero':(f.k==='por_cobrar'?'alerta':'')}" data-fila="${f.k}" type="button" title="${f.tit}">
      <span class="ico-box ${zero?'':(f.k==='por_cobrar'?'warn':'brand')}">${ICO(f.ico,17)}</span>
      <span class="txt"><span class="n">${v.n} ${v.n===1?'venda':'vendas'}</span>
      <span class="l">${f.lab}${v.t>0?' · '+BRL(v.t):''}</span></span></button>`;
  }).join('');
  document.querySelectorAll('[data-fila]').forEach(b=>b.onclick=()=>abrirFila(b.dataset.fila));
}
function renderKpis(){
  if(!OP||!DASH) return;
  const p=OP.periodos[periodo]||{};
  const rot={hoje:'hoje',ontem:'ontem',semana:'nesta semana'}[periodo];
  document.getElementById('kpis').innerHTML=[
    kpi({label:'Faturamento',ico:'financeiro',tone:'brand',mod:'is-brand',val:BRL(p.faturamento),sub:rot}),
    kpi({label:'Vendas',ico:'recibo',val:p.pedidos,sub:`${p.pdv.n} no balcão · ${p.site.n} no site`}),
    kpi({label:'Ticket médio',ico:'grafico',val:BRL(p.ticket),sub:'por venda'}),
    kpi({label:'Margem',ico:'subiu',val:p.margem_pct+'%',sub:'do faturamento'}),
    kpi({label:'A receber',ico:'relogio',tone:DASH.receivable_count?'warn':'',mod:DASH.receivable_count?'is-warn':'',
         val:BRL(DASH.receivable_total),sub:DASH.receivable_count+' em aberto'}),
    kpi({label:'Estoque a custo',ico:'estoque',val:BRL(DASH.stock_value_cost),sub:'capital parado'}),
    kpi({label:'Ruptura',ico:'alerta',tone:DASH.low_stock?'warn':'',mod:DASH.low_stock?'is-warn':'',
         val:DASH.low_stock,sub:'itens com 4 un. ou menos'}),
  ].join('');
}
document.getElementById('tabs').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); periodo=b.dataset.p; renderKpis();
};

const NOME_FILA=Object.fromEntries(FILAS.map(f=>[f.k,f.lab]));
async function abrirFila(k){
  const dlg=document.getElementById('dlgFila');
  document.getElementById('fTit').textContent=NOME_FILA[k];
  const box=document.getElementById('fLista');
  box.innerHTML='<div class="empty">'+ICO('sync',26)+'<div class="t">Carregando…</div></div>';
  dlg.showModal();
  try{
    const rows=await api('/api/operacao/'+k);
    box.innerHTML=rows.length?rows.map(r=>`<div class="row-item">
      <div class="l"><span>${r.code} · ${r.customer_name||'Sem cliente'}</span>
      <span class="s">${new Date(r.created_at).toLocaleDateString('pt-BR')} · ${r.channel==='site'?'site':'balcão'}${r.items_count?' · '+r.items_count+' item(ns)':''}</span></div>
      <span class="r">${BRL(r.total)}</span></div>`).join('')
      :vazio('ok','Fila vazia','Nada pendente aqui.');
  }catch(e){ box.innerHTML=vazio('alerta','Não deu pra carregar',e.message); }
}

/* ---------- Gráfico ---------- */
let serie=null; const svg=document.getElementById('chart');
function barPath(x,y,w,h,r){r=Math.min(r,w/2,Math.max(0,h));
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;}
function renderChart(){
  if(!serie) return;
  const wrap=document.getElementById('chartWrap');
  const W=Math.max(300,Math.round(wrap.clientWidth)), H=220;
  const padT=26,padB=28,padX=4;
  const plotH=H-padT-padB, base=padT+plotH, plotW=W-padX*2;
  const n=serie.length, step=plotW/n, bw=Math.min(38,step*0.58);
  const max=Math.max(...serie.map(s=>s.total),1);
  const every=W<460?3:2;
  let defs=`<defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BE05E"/><stop offset="100%" stop-color="#1B9938"/></linearGradient>
    <linearGradient id="barToday" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BFF9B"/><stop offset="100%" stop-color="#2FD24F"/></linearGradient>
  </defs>`;
  let g=`<line class="grid" x1="${padX}" y1="${padT}" x2="${W-padX}" y2="${padT}"/>`
       +`<text class="lbl" x="${padX}" y="${padT-8}">${BRL(max)}</text>`
       +`<line class="base" x1="${padX}" y1="${base}" x2="${W-padX}" y2="${base}"/>`;
  let bars='',labels='';
  serie.forEach((s,i)=>{
    const x=padX+i*step+(step-bw)/2;
    const h=s.total>0?Math.max(5,s.total/max*plotH):3;
    const y=base-h, hoje=i===n-1;
    bars+=`<path class="bar${hoje?' today':''}${s.total<=0?' zero':''}" d="${barPath(x,y,bw,h,4)}"/>`
         +`<rect class="hit" x="${padX+i*step}" y="${padT}" width="${step}" height="${plotH}" data-i="${i}"/>`;
    if(i%every===0||hoje) labels+=`<text class="lbl${hoje?' today':''}" x="${x+bw/2}" y="${H-9}" text-anchor="middle">${hoje?'hoje':s.date.slice(8,10)}</text>`;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  svg.innerHTML=defs+g+bars+labels;
}
function showTip(el,s){
  const tip=document.getElementById('tip'),wrap=document.getElementById('chartWrap');
  const r=el.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
  tip.hidden=false;
  tip.innerHTML=`<div class="d">${new Date(s.date+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</div>`
    +`<div class="v">${BRL(s.total)}</div><div class="n">${s.count} venda(s)</div>`;
  tip.style.left=(r.left-wr.left+r.width/2)+'px';
  tip.style.top=(r.top-wr.top+r.height*0.15)+'px';
}
svg.addEventListener('pointermove',e=>{const h=e.target.closest('.hit');h?showTip(h,serie[+h.dataset.i]):document.getElementById('tip').hidden=true;});
svg.addEventListener('pointerleave',()=>document.getElementById('tip').hidden=true);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderChart,140);});

/* ---------- Carregar ---------- */
async function load(){
  const d=await api('/api/dashboard');
  DASH=d;
  try{
    OP=await api('/api/operacao');
    renderFilas(); renderKpis();
    const a=document.getElementById('auto');
    a.innerHTML=OP.conectado
      ? `<span class="dot"></span>lendo a loja a cada ${OP.intervalo_min} min`
      : `loja não conectada`;
  }catch(e){}

  const rec=document.getElementById('recent');
  rec.innerHTML = d.recent_sales.length ? d.recent_sales.map(s=>{
    const tag = s.payment_status==='pendente'
      ? `<span class="pill" style="color:var(--warn);border-color:rgba(232,163,23,.3);background:rgba(232,163,23,.08)">Fiado</span>` : '';
    return `<div class="row-item"><div class="l"><span>${s.code} ${tag}</span>
      <span class="s">${s.customer_name||'Sem cliente'} · ${s.payment_method||'—'}</span></div>
      <span class="r" style="color:var(--ok)">${BRL(s.total)}</span></div>`;
  }).join('') : vazio('recibo','Sem vendas hoje','Assim que você lançar no PDV, aparece aqui.');

  const low=document.getElementById('low');
  low.innerHTML = d.low_stock_list.length ? d.low_stock_list.map(v=>
    `<div class="row-item"><div class="l"><span>${v.product_name}</span><span class="s">${v.variant_name||''}</span></div>
     <span class="r" style="color:var(--warn)">${v.stock} un.</span></div>`).join('')
    : vazio('ok','Estoque saudável','Nenhum item perto da ruptura.');

  const recv=document.getElementById('recv');
  if(d.pending_list&&d.pending_list.length){
    recv.innerHTML=d.pending_list.map(s=>
      `<div class="row-item"><div class="l"><span>${s.code} · ${s.customer_name||'Sem cliente'}</span>
        <span class="s">${DATA(s.created_at)}</span></div>
       <span class="settle"><span class="r" style="color:var(--warn)">${BRL(s.total)}</span>
       <button class="btn sm" data-settle="${s.id}" type="button">Receber</button></span></div>`).join('');
    recv.querySelectorAll('[data-settle]').forEach(b=>b.addEventListener('click',async()=>{
      b.disabled=true;
      try{await api('/api/sales/'+b.dataset.settle+'/settle',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await load();}
      catch(e){alert(e.message);b.disabled=false;}
    }));
  } else recv.innerHTML=vazio('ok','Nada a receber','Todo mundo em dia por aqui.');

  // Lembretes
  const rem=document.getElementById('rem');
  const R=d.reminders||{};
  if(d.reminders_list&&d.reminders_list.length){
    rem.innerHTML=d.reminders_list.map(r=>{
      const hoje=new Date().toISOString().slice(0,10);
      const late=r.due_date&&r.due_date<hoje, now_=r.due_date===hoje;
      const q=!r.due_date?'sem data':(late?'atrasado':(now_?'hoje':new Date(r.due_date+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})));
      return `<div class="row-item"><div class="l"><span>${r.title}</span>
        <span class="s">${q}${r.customer_name?' · '+r.customer_name:''}</span></div>
        <span class="r" style="color:${late?'var(--crit)':(now_?'var(--warn)':'var(--ink-2)')}">${r.amount?BRL(r.amount):''}</span></div>`;
    }).join('')+`<a class="btn sm ghost" href="/lembretes" style="margin-top:6px">Ver todos</a>`;
  } else rem.innerHTML=vazio('sino','Nada pendente','Anote em Lembretes o que não pode escapar.');

  // Maestro
  const p=[];
  const site=(d.por_origem_hoje||[]).find(o=>o.o==='site'), pdv=(d.por_origem_hoje||[]).find(o=>o.o==='pdv');
  if(d.orders_today>0){
    const det=[];
    if(pdv) det.push(`<b>${pdv.n}</b> no balcão`);
    if(site) det.push(`<b>${site.n}</b> pelo site`);
    p.push(`Já são <b>${d.orders_today}</b> venda(s) hoje${det.length?' ('+det.join(' e ')+')':''}, <b class="hl">${BRL(d.revenue_today)}</b> no caixa com margem de <b>${d.margin_pct}%</b>.`);
  } else p.push('Ainda sem vendas hoje — o PDV está pronto.');
  if(d.receivable_count>0) p.push(`Tem <b class="hl">${BRL(d.receivable_total)}</b> em fiado pra receber.`);
  if(R.atrasados>0) p.push(`E <b>${R.atrasados}</b> lembrete(s) já passaram da data.`);
  else if(R.hoje>0) p.push(`Tem <b>${R.hoje}</b> lembrete(s) pra hoje.`);
  if(d.low_stock>0) p.push(`Fica de olho: <b>${d.low_stock}</b> item(ns) perto da ruptura.`);
  document.getElementById('maestroMsg').innerHTML='Fala, chefe. '+p.join(' ');

  const tags=[];
  if(R.atrasados>0) tags.push(`<a class="m-tag crit" href="/lembretes">${ICO('alerta',13)}${R.atrasados} lembrete(s) atrasado(s)</a>`);
  if(R.hoje>0) tags.push(`<a class="m-tag warn" href="/lembretes">${ICO('calendario',13)}${R.hoje} pra hoje</a>`);
  if(d.receivable_count>0) tags.push(`<a class="m-tag warn" href="/clientes">${ICO('recibo',13)}${BRL(d.receivable_total)} a receber</a>`);
  if(d.low_stock>0) tags.push(`<a class="m-tag warn" href="/produtos">${ICO('estoque',13)}${d.low_stock} perto da ruptura</a>`);
  if(!tags.length) tags.push(`<span class="m-tag ok">${ICO('ok',13)}Tudo em dia</span>`);
  document.getElementById('maestroTags').innerHTML=tags.join('');
}
async function loadChart(){
  try{const d=await api('/api/sales-series?days=14');serie=d.series;
    document.getElementById('chartSub').textContent='últimos '+d.days+' dias';renderChart();}catch(e){}
}
document.getElementById('pdvLink').insertAdjacentHTML('afterbegin',ICO('pdv',16));
load(); loadChart(); setInterval(()=>{load();loadChart();},20000);
</script>
