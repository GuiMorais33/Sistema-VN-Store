<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070907">
<title>VN Store — Lembretes</title>
<link rel="icon" href="/logo.webp">
<link rel="stylesheet" href="/theme.css">
<style>
  .seg{display:inline-flex;gap:3px;background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{padding:6px 14px;border-radius:8px;border:none;background:none;color:var(--ink-3);
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:var(--t-fast)}
  .seg button:hover{color:var(--ink)}
  .seg button.sel{background:rgba(47,210,79,.13);color:var(--brand-hi)}

  .lista{display:flex;flex-direction:column;gap:7px}
  .lem{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;padding:13px var(--s4);
    border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(180deg,var(--surface-2),var(--surface));transition:var(--t-fast)}
  .lem:hover{border-color:var(--line-str)}
  .lem.atrasado{border-color:rgba(242,86,74,.4);background:linear-gradient(180deg,rgba(242,86,74,.06),var(--surface))}
  .lem.hoje{border-color:rgba(232,163,23,.42)}
  .lem.feito{opacity:.5}
  .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-str);background:var(--bg-elev);
    cursor:pointer;display:grid;place-items:center;color:transparent;flex:0 0 auto;margin-top:1px;transition:var(--t-fast)}
  .chk:hover{border-color:var(--brand)}
  .chk.on{background:var(--brand);border-color:var(--brand);color:#04170A}
  .lem .t{font-weight:600;font-size:14px;line-height:1.35}
  .lem.feito .t{text-decoration:line-through}
  .lem .n{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
  .lem .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .tg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    background:var(--bg-elev);border:1px solid var(--line);color:var(--ink-3)}
  .tg.dt{color:var(--ink-2)} .tg.late{color:var(--crit);border-color:rgba(242,86,74,.35);background:rgba(242,86,74,.08)}
  .tg.now{color:var(--warn);border-color:rgba(232,163,23,.35);background:rgba(232,163,23,.08)}
  .tg.val{color:var(--brand-hi);border-color:rgba(47,210,79,.3);background:rgba(47,210,79,.08);font-family:var(--font-mono)}
  .acts{display:flex;gap:5px;align-items:center}
  .ib{background:none;border:1px solid transparent;border-radius:8px;color:var(--ink-3);cursor:pointer;
    padding:5px;display:grid;place-items:center;transition:var(--t-fast)}
  .ib:hover{color:var(--crit);border-color:rgba(242,86,74,.3);background:rgba(242,86,74,.07)}

  .dlg{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);min-width:min(430px,92vw)}
  .dlg h3{margin:0;font-family:var(--font-disp);text-transform:uppercase;font-size:18px;transform:skewX(-5deg)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
  @media (max-width:520px){.g2{grid-template-columns:1fr}}
  .tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .tp{padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink-3);
    font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:var(--t-fast)}
  .tp:hover{color:var(--ink)}
  .tp.sel{border-color:var(--brand);color:var(--brand-hi);background:rgba(47,210,79,.1)}
  .dlg-foot{display:flex;gap:var(--s2);justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
  <div class="pagehead">
    <div><h1>Lembretes</h1><div class="ph-sub">O que não pode ser esquecido</div></div>
    <div class="ph-actions">
      <div class="seg" id="filtro">
        <button data-f="abertos" class="sel" type="button">Abertos</button>
        <button data-f="feitos" type="button">Feitos</button>
        <button data-f="todos" type="button">Todos</button>
      </div>
      <button class="btn primary" id="novo" type="button">Novo lembrete</button>
    </div>
  </div>

  <div class="kpis" id="resumo" style="margin-bottom:var(--s4)"></div>
  <div class="lista" id="lista"></div>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog">
    <h3 id="dlgT">Novo lembrete</h3>
    <input type="hidden" id="rId">
    <div class="field"><label>O que precisa lembrar? *</label>
      <input id="rT" required placeholder="Ex.: João paga a segunda parcela"></div>
    <div class="field"><label>Tipo</label>
      <div class="tipos" id="tipos">
        <button type="button" class="tp sel" data-k="geral">Geral</button>
        <button type="button" class="tp" data-k="pagamento">Pagamento</button>
        <button type="button" class="tp" data-k="encomenda">Encomenda</button>
        <button type="button" class="tp" data-k="reposicao">Reposição</button>
      </div>
    </div>
    <div class="g2">
      <div class="field"><label>Quando</label><input id="rD" type="date"></div>
      <div class="field"><label>Valor (opcional)</label><input id="rV" type="number" step="0.01" placeholder="R$"></div>
    </div>
    <div class="field"><label>Cliente (opcional)</label>
      <select id="rC"><option value="">— nenhum —</option></select></div>
    <div class="field"><label>Detalhes</label><textarea id="rN" rows="2" placeholder="Anote o que precisar"></textarea></div>
    <div class="dlg-foot">
      <button class="btn ghost" value="cancel" type="submit">Cancelar</button>
      <button class="btn primary" id="save" value="ok" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<script src="/icons.js"></script>
<script src="/nav.js"></script>
<script>
const BRL=(n)=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(p,o){const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d;}
const vazio=(i,t,d)=>`<div class="empty">${ICO(i,30)}<div class="t">${t}</div><div class="d">${d||''}</div></div>`;
document.getElementById('novo').insertAdjacentHTML('afterbegin',ICO('mais',16));
let filtro='abertos', tipo='geral';

const ICO_TIPO={geral:'lembrete',pagamento:'financeiro',encomenda:'entrega',reposicao:'estoque'};
const NOME_TIPO={geral:'Geral',pagamento:'Pagamento',encomenda:'Encomenda',reposicao:'Reposição'};
function dataBr(s){if(!s)return '';const [a,m,d]=s.split('-');return `${d}/${m}`;}
function quando(r){
  if(!r.due_date)return {cls:'',txt:'sem data'};
  if(r.atrasado)return {cls:'late',txt:'atrasado · '+dataBr(r.due_date)};
  if(r.hoje)return {cls:'now',txt:'hoje'};
  const dias=Math.round((new Date(r.due_date+'T12:00')-new Date().setHours(12,0,0,0))/864e5);
  if(dias===1)return {cls:'now',txt:'amanhã'};
  return {cls:'dt',txt:dataBr(r.due_date)};
}

async function carregar(){
  const d=await api('/api/reminders?filter='+filtro);
  const R=d.resumo||{};
  document.getElementById('resumo').innerHTML=[
    {l:'Atrasados',v:R.atrasados||0,i:'alerta',t:(R.atrasados>0?'crit':''),m:(R.atrasados>0?'is-warn':''),s:'passaram da data'},
    {l:'Para hoje',v:R.hoje||0,i:'calendario',t:(R.hoje>0?'warn':''),s:'vencem hoje'},
    {l:'Em aberto',v:R.abertos||0,i:'sino',t:'brand',s:'no total'},
  ].map(k=>`<div class="kpi ${k.m||''}">
      <div class="kpi-top"><span class="label">${k.l}</span>
        <span class="ico-box ${k.t}" style="width:30px;height:30px">${ICO(k.i,16)}</span></div>
      <div class="kpi-val">${k.v}</div><div class="kpi-sub"><span>${k.s}</span></div></div>`).join('');

  const box=document.getElementById('lista');
  if(!d.items.length){
    box.innerHTML=vazio('sino', filtro==='feitos'?'Nada concluído ainda':'Nenhum lembrete',
      'Anote aqui o que não pode escapar: quem vai pagar, encomenda de cliente, reposição.');
    return;
  }
  box.innerHTML='';
  for(const r of d.items){
    const q=quando(r);
    const el=document.createElement('div');
    el.className='lem'+(r.done?' feito':(r.atrasado?' atrasado':(r.hoje?' hoje':'')));
    el.innerHTML=`<button class="chk ${r.done?'on':''}" type="button" aria-label="concluir">${ICO('ok',14)}</button>
      <div><div class="t">${r.title}</div>
        ${r.notes?`<div class="n">${r.notes}</div>`:''}
        <div class="tags">
          <span class="tg">${ICO(ICO_TIPO[r.kind]||'lembrete',12)}${NOME_TIPO[r.kind]||'Geral'}</span>
          <span class="tg ${q.cls}">${ICO('calendario',12)}${q.txt}</span>
          ${r.customer_name?`<span class="tg">${ICO('clientes',12)}${r.customer_name}</span>`:''}
          ${r.amount?`<span class="tg val">${BRL(r.amount)}</span>`:''}
        </div></div>
      <div class="acts"><button class="ib" data-del="${r.id}" type="button" aria-label="apagar">${ICO('lixeira',16)}</button></div>`;
    el.querySelector('.chk').onclick=async()=>{
      await api('/api/reminders/'+r.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:!r.done})});
      carregar();
    };
    el.querySelector('[data-del]').onclick=async()=>{
      if(!confirm('Apagar este lembrete?'))return;
      await api('/api/reminders/'+r.id,{method:'DELETE'});carregar();
    };
    el.querySelector('.t').onclick=()=>editar(r);
    el.querySelector('.t').style.cursor='pointer';
    box.appendChild(el);
  }
}

async function clientes(){
  const rows=await api('/api/customers');
  document.getElementById('rC').innerHTML='<option value="">— nenhum —</option>'
    +rows.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function setTipo(k){tipo=k;document.querySelectorAll('.tp').forEach(t=>t.classList.toggle('sel',t.dataset.k===k));}
document.getElementById('tipos').onclick=e=>{const b=e.target.closest('.tp');if(b)setTipo(b.dataset.k);};

const dlg=document.getElementById('dlg');
document.getElementById('novo').onclick=()=>{
  document.getElementById('dlgT').textContent='Novo lembrete';
  ['rId','rT','rD','rV','rN'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('rC').value='';setTipo('geral');dlg.showModal();
};
function editar(r){
  document.getElementById('dlgT').textContent='Editar lembrete';
  document.getElementById('rId').value=r.id;document.getElementById('rT').value=r.title;
  document.getElementById('rD').value=r.due_date||'';document.getElementById('rV').value=r.amount||'';
  document.getElementById('rN').value=r.notes||'';document.getElementById('rC').value=r.customer_id||'';
  setTipo(r.kind||'geral');dlg.showModal();
}
document.getElementById('save').onclick=async e=>{
  const title=document.getElementById('rT').value.trim();if(!title)return;
  e.preventDefault();
  const body={title,kind:tipo,due_date:document.getElementById('rD').value||null,
    amount:parseFloat(document.getElementById('rV').value)||null,
    customer_id:document.getElementById('rC').value||null,notes:document.getElementById('rN').value.trim()};
  const id=document.getElementById('rId').value;
  try{await api(id?('/api/reminders/'+id):'/api/reminders',{method:id?'PUT':'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    dlg.close();carregar();}catch(err){alert(err.message);}
};
document.getElementById('filtro').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#filtro button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  filtro=b.dataset.f;carregar();};
clientes();carregar();
</script>
</body>
</html>
