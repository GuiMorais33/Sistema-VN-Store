<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070907">
<title>VN Store — Relatórios</title>
<link rel="icon" href="/logo.webp">
<link rel="stylesheet" href="/theme.css">
<style>
  .seg{display:inline-flex;gap:3px;background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{padding:6px 13px;border-radius:8px;border:none;background:none;color:var(--ink-3);
    font-size:12.5px;font-weight:700;cursor:pointer;transition:var(--t-fast);font-family:var(--font-body)}
  .seg button:hover{color:var(--ink)}
  .seg button.sel{background:rgba(47,210,79,.13);color:var(--brand-hi)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  .panel{padding:var(--s4)}
  .panel h3{margin:0 0 var(--s2);font-size:14px}

  .bar-row{display:grid;grid-template-columns:minmax(78px,1.05fr) 1fr 104px;gap:10px;align-items:center;margin-bottom:9px}
  .bar-lab{font-size:12.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{height:9px;border-radius:6px;background:var(--bg-elev);overflow:hidden;display:block;border:1px solid var(--line-soft)}
  .bar-fill{display:block;height:100%;min-width:4px;border-radius:6px;
    background:linear-gradient(90deg,var(--brand-deep),var(--brand));box-shadow:0 0 10px var(--glow)}
  .bar-val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;text-align:right}
  .bar-val .p{display:block;font-size:10px;color:var(--ink-3);font-weight:600}

  .thead,.prow{display:grid;grid-template-columns:26px 44px minmax(0,2fr) 62px 96px 96px 66px;
    gap:var(--s3);align-items:center}
  .thead{padding:0 var(--s4) var(--s2);font-size:10px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--ink-3);font-weight:700}
  .thead div:nth-child(n+4){text-align:right}
  .rowsw{display:flex;flex-direction:column;gap:5px}
  .prow{padding:8px var(--s4);border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(180deg,var(--surface-2),var(--surface))}
  .prow .thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--bg-elev);
    display:grid;place-items:center;color:var(--ink-3)}
  .prow .thumb img{width:100%;height:100%;object-fit:cover}
  .prow .nm{font-weight:600;font-size:13px;line-height:1.3}
  .prow .meta{font-size:10.5px;color:var(--ink-3);margin-top:2px;font-family:var(--font-mono)}
  .prow .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
  .prow .n.lucro{font-weight:700;color:var(--brand-hi)}
  .prow .n.lucro.neg{color:var(--crit)}
  .cls{font-family:var(--font-disp);font-weight:900;font-size:15px;text-align:center;transform:skewX(-6deg)}
  .cls.A{color:var(--brand-hi)} .cls.B{color:var(--warn)} .cls.C{color:var(--ink-3)}
  .pct{font-family:var(--font-mono);font-weight:700;font-size:12.5px;text-align:right}
  .pct.ok{color:var(--ok)} .pct.baixa{color:var(--warn)} .pct.neg{color:var(--crit)}
  @media (max-width:900px){
    .thead{display:none}
    .prow{grid-template-columns:26px 44px 1fr 84px;gap:4px var(--s3);align-items:center}
    .prow .thumb{grid-row:1/span 3} .cls{grid-row:1/span 3}
    .prow .who{grid-column:3/span 2}
    .prow .n,.pct{grid-column:4}
  }

  .abc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:var(--s3)}
  .ab{padding:11px 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-elev)}
  .ab .l{font-family:var(--font-disp);font-weight:900;font-size:17px;transform:skewX(-6deg)}
  .ab.A .l{color:var(--brand-hi)} .ab.B .l{color:var(--warn)} .ab.C .l{color:var(--ink-3)}
  .ab .v{font-family:var(--font-mono);font-weight:700;font-size:14px;margin-top:3px}
  .ab .s{font-size:10.5px;color:var(--ink-3);margin-top:2px}

  .pr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-elev);font-size:12.5px}
  .pr .thumb{width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--surface-2);
    display:grid;place-items:center;color:var(--ink-3)}
  .pr .thumb img{width:100%;height:100%;object-fit:cover}
  .pr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pr .s{font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono);margin-top:2px}
  .pr .v{font-family:var(--font-mono);font-weight:700;color:var(--warn);text-align:right;white-space:nowrap}
  .lista{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow-y:auto}
</style>
</head>
<body>
<div class="app">
  <div class="pagehead">
    <div><h1>Relatórios</h1><div class="ph-sub">O que dá lucro · onde o dinheiro está parado</div></div>
    <div class="ph-actions">
      <div class="seg" id="per">
        <button data-d="30" type="button">30 dias</button>
        <button data-d="90" class="sel" type="button">90 dias</button>
        <button data-d="365" type="button">1 ano</button>
      </div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="sec"><h2>Onde está o lucro</h2><span class="rule"></span>
    <span class="meta" id="abcMeta"></span></div>
  <div class="abc" id="abc"></div>

  <div class="thead">
    <div></div><div></div><div>Produto</div><div>Peças</div><div>Receita</div><div>Lucro</div><div>Margem</div>
  </div>
  <div class="rowsw" id="rows"><div class="sk" style="height:58px"></div></div>

  <div class="cols">
    <div class="card panel"><h3>Lucro por marca</h3><div id="porMarca"></div></div>
    <div class="card panel"><h3>Lucro por categoria</h3><div id="porCat"></div></div>
  </div>

  <div class="sec"><h2>Dinheiro parado</h2><span class="rule"></span>
    <span class="meta" id="paradoMeta"></span></div>
  <div class="lista" id="parado"></div>
</div>

<script src="/icons.js"></script>
<script src="/nav.js"></script>
<script>
const BRL=(n)=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const D=(s)=>s?new Date(s).toLocaleDateString('pt-BR'):'nunca';
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o){const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d;}
const vazio=(i,t,d)=>`<div class="empty">${ICO(i,30)}<div class="t">${t}</div><div class="d">${d||''}</div></div>`;
let dias=90;

// Mesmo componente das outras telas — KPI tem que ser igual em todo lugar.
function kpi(o){return `<div class="kpi ${o.mod||''}">
  <div class="kpi-top"><span class="label">${o.label}</span>
    <span class="ico-box ${o.tone||''}" style="width:30px;height:30px">${ICO(o.ico,16)}</span></div>
  <div class="kpi-val" style="${o.color?'color:'+o.color:''}">${o.val}</div>
  <div class="kpi-sub"><span>${o.sub||''}</span></div></div>`;}
function barras(el,lista,total){
  if(!lista.length){el.innerHTML='<div class="hint">Sem vendas no período.</div>';return;}
  const max=Math.max(...lista.map(x=>Math.max(0,x.lucro)),1);
  el.innerHTML=lista.slice(0,10).map(x=>{
    const pct=total>0?Math.round((x.lucro/total)*100):0;
    return `<div class="bar-row"><span class="bar-lab">${esc(x.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(3,(Math.max(0,x.lucro)/max)*100)}%"></span></span>
      <span class="bar-val">${BRL(x.lucro)}<span class="p">${pct}% do lucro</span></span></div>`;
  }).join('');
}

async function carregar(){
  document.getElementById('rows').innerHTML='<div class="sk" style="height:58px"></div><div class="sk" style="height:58px"></div>';
  const d=await api('/api/relatorios?days='+dias);
  const t=d.totais;

  document.getElementById('kpis').innerHTML=[
    kpi({label:'Receita',ico:'subiu',tone:'brand',val:BRL(t.receita),sub:`${t.pecas} peça(s) vendida(s)`,color:'var(--ok)'}),
    kpi({label:'Custo das peças',ico:'caixa_vazia',tone:'crit',val:BRL(t.custo),sub:'o que você pagou por elas',color:'var(--crit)'}),
    kpi({label:'Lucro bruto',ico:'grafico',tone:'brand',val:BRL(t.lucro),sub:'receita menos o custo',color:'var(--brand-hi)'}),
    kpi({label:'Margem',ico:'etiqueta',tone:t.margem_pct<25?'warn':'',mod:t.margem_pct<25?'is-warn':'',
      val:t.margem_pct+'%',sub:t.margem_pct<25?'apertada':'saudável'}),
  ].join('');

  // Curva ABC
  const abcBox=document.getElementById('abc');
  abcBox.innerHTML=d.abc.map(a=>`<div class="ab ${a.classe}">
      <div class="l">${a.classe}</div><div class="v">${BRL(a.lucro)}</div>
      <div class="s">${a.produtos} produto(s)</div></div>`).join('');
  const nA=(d.abc.find(a=>a.classe==='A')||{produtos:0}).produtos;
  document.getElementById('abcMeta').textContent=nA
    ? `${nA} produto(s) fazem 80% do lucro` : '';

  // Ranking de produtos
  const box=document.getElementById('rows');
  if(!d.produtos.length){
    box.innerHTML=vazio('grafico','Nenhuma venda no período','Lance vendas no PDV ou espere os pedidos do site.');
  }else{
    box.innerHTML=d.produtos.map(p=>{
      const marg=p.receita>0?Math.round((p.lucro/p.receita)*100):0;
      const img=p.imagem?`<img src="${esc(p.imagem)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICO('estoque',18)}))">`:ICO('estoque',18);
      return `<div class="prow">
        <div class="cls ${p.classe}">${p.classe}</div>
        <span class="thumb">${img}</span>
        <div class="who"><div class="nm">${esc(p.produto)}</div>
          <div class="meta">${esc(p.marca||'sem marca')}${p.categoria?' · '+esc(p.categoria):''}</div></div>
        <div class="n">${p.pecas}</div>
        <div class="n">${BRL(p.receita)}</div>
        <div class="n lucro${p.lucro<0?' neg':''}">${BRL(p.lucro)}</div>
        <div class="pct ${marg<0?'neg':(marg<25?'baixa':'ok')}">${marg}%</div>
      </div>`;
    }).join('');
  }

  barras(document.getElementById('porMarca'),d.por_marca,t.lucro);
  barras(document.getElementById('porCat'),d.por_categoria,t.lucro);

  // Dinheiro parado
  document.getElementById('paradoMeta').textContent=d.parado.length
    ? `${BRL(d.total_parado)} a custo, sem vender há ${dias} dias` : '';
  const pb=document.getElementById('parado');
  pb.innerHTML=d.parado.length?d.parado.map(p=>{
    const img=p.imagem?`<img src="${esc(p.imagem)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICO('estoque',16)}))">`:ICO('estoque',16);
    return `<div class="pr"><span class="thumb">${img}</span>
      <div><div class="nm">${esc(p.produto)}${p.on_demand?' · sob encomenda':''}</div>
        <div class="s">${p.pecas} peça(s) · última venda ${D(p.ultima_venda)}</div></div>
      <div class="v">${BRL(p.parado_custo)}</div></div>`;
  }).join(''):vazio('ok','Nada parado','Todo produto com estoque vendeu neste período.');
}

document.getElementById('per').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#per button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');dias=parseInt(b.dataset.d,10);carregar();
};
carregar();
</script>
</body>
</html>
